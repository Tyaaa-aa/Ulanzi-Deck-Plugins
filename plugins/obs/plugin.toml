id = "obs"
name = "OBS Studio"
version = "1.2.0"
contract = "1.2"
min_app = "2.1.0"
tested_on_hardware = true
icon = "assets/icon.svg"
symbolic_icon = "assets/symbolic.svg"
description = "Scenes, recording, streaming, replay buffer, virtual camera and audio, with live state on key labels."
categories = ["streaming"]
background = true

[permissions]
network = ["127.0.0.1", "localhost"]

[detect]                            # read from milestone 4 on
programs = ["obs"]
desktop_ids = ["com.obsproject.Studio"]

[auth]                              # not read yet (sign-in flows come later); the password is the secret setting below
kind = "password"

[[settings]]
key = "host"
kind = "text"
label = "Address"
default = "localhost"
help = "OBS must run on this computer"

[[settings]]
key = "port"
kind = "number"
label = "Port"
min = 1
max = 65535
default = 4455
help = "4455 unless you changed it in OBS"

[[settings]]
key = "password"
kind = "secret"
label = "Password"
help = "OBS: Tools → WebSocket Server Settings → Show Connect Info"

[[pickers]]
id = "scenes"
style = "grid"

# Several scenes at once, for the scene keys.
[[pickers]]
id = "scene_keys"
style = "grid"
multi = true

[[pickers]]
id = "audio_inputs"
style = "list"

[[pickers]]
id = "scene_sources"
style = "list"
groups = true

[[pickers]]
id = "sources"
style = "list"

[[pickers]]
id = "filters"
style = "list"
groups = true

[[pickers]]
id = "collections"
style = "list"

[[pickers]]
id = "profiles"
style = "list"

[[actions]]
id = "set_scene"
name = "Switch scene"
icon = "assets/actions/set_scene.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.scene}", is = ["$scene"] }, background = "#26a269" },
  { when = { value = "{obs.preview}", is = ["$scene"] }, background = "#c64600" },
]
labels = [{ name = "Scene name", text = "$scene" }, { name = "Live scene", text = "{obs.scene}" }]
params = [
  { key = "scene", kind = "item", picker = "scenes", label = "Scene" },
  { key = "preview", kind = "toggle", label = "Set the preview scene instead (studio mode)" },
]

[[actions]]
id = "toggle_scenes"
name = "Toggle between two scenes"
icon = "assets/actions/toggle_scenes.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.scene}", is = ["$a", "$b"] }, label = "{obs.scene}" },
]
params = [
  { key = "a", kind = "item", picker = "scenes", label = "First scene" },
  { key = "b", kind = "item", picker = "scenes", label = "Second scene" },
]

[[actions]]
id = "toggle_source"
name = "Show or hide a source"
icon = "assets/actions/toggle_source.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.visible.$scene/$source}", is = ["no"] }, color = "#5e5c64", icon = "assets/states/eye-off.svg" },
]
params = [
  { key = "scene", kind = "item", picker = "scenes", label = "Scene" },
  { key = "source", kind = "item", picker = "scene_sources", label = "Scene / Source" },
]

[[actions]]
id = "toggle_record"
name = "Toggle recording"
icon = "assets/actions/toggle_record.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.rec_paused}", is = ["yes"] }, background = "#c64600", label = "PAUSED" },
  { when = { value = "{obs.recording}", is = ["yes"] }, background = "#c01c28", label = "REC {obs.rec_time}" },
]
labels = [{ name = "Recording time", text = "{obs.rec_time}" }]

[[actions]]
id = "start_record"
name = "Start recording"
icon = "assets/actions/start_record.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.rec_paused}", is = ["yes"] }, background = "#c64600", label = "PAUSED" },
  { when = { value = "{obs.recording}", is = ["yes"] }, background = "#c01c28", label = "REC {obs.rec_time}" },
]
labels = [{ name = "Recording time", text = "{obs.rec_time}" }]

[[actions]]
id = "stop_record"
name = "Stop recording"
icon = "assets/actions/stop_record.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.rec_paused}", is = ["yes"] }, background = "#c64600", label = "PAUSED" },
  { when = { value = "{obs.recording}", is = ["yes"] }, background = "#c01c28", label = "REC {obs.rec_time}" },
]
labels = [{ name = "Recording time", text = "{obs.rec_time}" }]

[[actions]]
id = "pause_record"
name = "Pause or resume recording"
icon = "assets/actions/pause_record.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.rec_paused}", is = ["yes"] }, background = "#c64600", icon = "assets/states/circle-pause.svg" },
]

[[actions]]
id = "toggle_stream"
name = "Toggle streaming"
icon = "assets/actions/toggle_stream.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.streaming}", is = ["yes"] }, background = "#c01c28", label = "LIVE {obs.stream_time}" },
]
labels = [{ name = "Streaming time", text = "{obs.stream_time}" }]

[[actions]]
id = "start_stream"
name = "Start streaming"
icon = "assets/actions/start_stream.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.streaming}", is = ["yes"] }, background = "#c01c28", label = "LIVE {obs.stream_time}" },
]
labels = [{ name = "Streaming time", text = "{obs.stream_time}" }]

[[actions]]
id = "stop_stream"
name = "Stop streaming"
icon = "assets/actions/stop_stream.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.streaming}", is = ["yes"] }, background = "#c01c28", label = "LIVE {obs.stream_time}" },
]
labels = [{ name = "Streaming time", text = "{obs.stream_time}" }]

[[actions]]
id = "toggle_replay"
name = "Toggle replay buffer"
icon = "assets/actions/toggle_replay.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.replay}", is = ["yes"] }, background = "#26a269" },
]

[[actions]]
id = "save_replay"
name = "Save replay"
icon = "assets/actions/save_replay.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
]

[[actions]]
id = "toggle_virtual_cam"
name = "Toggle virtual camera"
icon = "assets/actions/toggle_virtual_cam.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.vcam}", is = ["yes"] }, background = "#1c71d8" },
]

[[actions]]
id = "toggle_mute"
name = "Mute or unmute an input"
icon = "assets/actions/toggle_mute.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
  { when = { value = "{obs.mute.$input}", is = ["yes"] }, background = "#c01c28", icon = "assets/states/mic-off.svg" },
]
params = [
  { key = "input", kind = "item", picker = "audio_inputs", label = "Audio input" },
]

[[actions]]
id = "input_volume"
name = "Change an input's volume"
icon = "assets/actions/input_volume.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
]
params = [
  { key = "input", kind = "item", picker = "audio_inputs", label = "Audio input" },
  { key = "op", kind = "choice", label = "Change", choices = ["up", "down", { value = "mute", label = "Mute or unmute" }, "set"] },
  { key = "percent", kind = "number", label = "Volume (percent, for Set)", min = 0, max = 100 },
  { key = "step", kind = "number", label = "Step (dB)", min = 1, max = 20, default = 2 },
]

[[actions]]
id = "toggle_filter"
name = "Turn a filter on or off"
icon = "assets/actions/toggle_filter.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
]
params = [
  { key = "source", kind = "item", picker = "sources", label = "Source" },
  { key = "filter", kind = "item", picker = "filters", label = "Filter" },
]

[[actions]]
id = "studio_transition"
name = "Studio mode: transition"
icon = "assets/actions/studio_transition.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
]

[[actions]]
id = "set_collection"
name = "Switch scene collection"
icon = "assets/actions/set_collection.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
]
params = [
  { key = "name", kind = "item", picker = "collections", label = "Scene collection" },
]

[[actions]]
id = "set_profile"
name = "Switch OBS profile"
icon = "assets/actions/set_profile.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
]
params = [
  { key = "name", kind = "item", picker = "profiles", label = "OBS profile" },
]

[[actions]]
id = "screenshot"
name = "Take a screenshot"
icon = "assets/actions/screenshot.svg"
states = [
  { when = { value = "{obs.connected}", is = ["no"] }, color = "#5e5c64" },
]

[[actions]]
id = "reconnect"
name = "Reconnect to OBS"
icon = "assets/actions/reconnect.svg"

[[actions]]
id = "forget_password"
name = "Forget the OBS password"
icon = "assets/actions/forget_password.svg"

# Ready-made keys: one key per scene the user picks.
[[key_sets]]
id = "scenes"
name = "Scene keys"
description = "Pick scenes; each gets a key that switches to it"
icon = "assets/actions/set_scene.svg"
picker = "scene_keys"

[[key_sets.variants]]
keys = [
  { action = "set_scene", params = { scene = "$id" }, label = "$name" },
]
